[project]
name = "union-prep"
version = "0.1.0"
description = "A working slice of an AI-native specialty brokerage"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
